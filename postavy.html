<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Parkside – postavy</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap" rel="stylesheet">
<style>
/* VOICE: kreslený seriál, vřelý a vtipný
   IDEA: model sheet postav jako na začátku animáku, postavy na trávníku u plotu
   PICTURE: 3D scéna přes celou plochu, otáčení tažením
   COLOUR and TYPE: tráva #7cbf5a, nebe #bfe6ff, dřevo plotu #b07a4a, akcent dílenská zelená #1f4d3a; Rubik
   LAYOUT: scéna nahoře, pod ní řada jmen jako tlačítka, popis vybrané postavy */
:root{color-scheme:light dark;--bg:light-dark(#f4efe6,#1b1a17);--ink:light-dark(#1d1b17,#f4efe6);--acc:#1f4d3a;--chip:light-dark(#fff,#2a2824)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip}
.stage{position:relative;height:min(68vh,620px);min-height:340px}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.bubble{position:absolute;font-weight:800;font-size:20px;background:#fff;color:#1d1b17;padding:4px 12px;border-radius:14px;transform:translate(-50%,-100%);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:0 3px 0 #0002}
.bubble.on{opacity:1}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:14px max(4vw,14px) 4px}
.bar button{font:500 16px Rubik,sans-serif;min-height:44px;padding:0 18px;border-radius:999px;border:2px solid var(--acc);background:var(--chip);color:var(--ink);cursor:pointer}
.bar button[aria-pressed=true]{background:var(--acc);color:#fff}
.bar button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.info{padding:6px max(4vw,14px) 28px;max-width:680px}
.info h2{margin:0;font-size:32px;line-height:1.1}
.info p{margin:6px 0 0}
.logo{position:absolute;top:14px;left:max(4vw,14px);margin:0;font:800 clamp(28px,6vw,44px)/1 Rubik,sans-serif;color:#fff;text-shadow:0 3px 0 #1f4d3a,0 6px 14px #0004;pointer-events:none}
.note{font-size:13px;opacity:.7;margin-top:10px}
</style>
</head>
<body>
<div class="stage"><canvas id="c"></canvas><h1 class="logo">The Parkside</h1><div class="bubble" id="haf">HAF!</div></div>
<div class="bar" id="bar"></div>
<div class="info"><h2 id="nm"></h2><p id="ds"></p><p class="note">Táhni prstem nebo myší pro otočení.</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="characters.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const canvas=$('c');
const R=new THREE.WebGLRenderer({canvas,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xbfe6ff);
const cam=new THREE.PerspectiveCamera(40,1,.1,100);
scene.add(new THREE.HemisphereLight(0xffffff,0x6a8f4a,.75));
const sun=new THREE.DirectionalLight(0xfff4e0,.85);sun.position.set(4,8,6);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8});scene.add(sun);

const {M,part,SPH,BOX,CYL,CONE}=PS;
// zem a plot
const g=new THREE.Mesh(new THREE.CircleGeometry(14,48),M(0x7cbf5a));g.rotation.x=-Math.PI/2;g.receiveShadow=true;scene.add(g);
for(let i=-6;i<=6;i++){part(BOX,0xb07a4a,i*.9,.9,-3.2,scene,.8,1.8,.08)}
part(BOX,0x8a5a32,0,1.5,-3.15,scene,12,.12,.1);part(BOX,0x8a5a32,0,.5,-3.15,scene,12,.12,.1);

const ashley=PS.ashley(),jackie=PS.jackie(),boban=PS.boban();
const P=PS.pavel(),T=PS.tereza();
const cast=[
  {o:P,x:-2.4,name:'Pavel',desc:'Kutil s dílnou na dvorku. Ježaté melírované vlasy, černé triko, zelené pracovní lacláče a v ruce vrtačka. Pořád něco vymýšlí ze dřeva.'},
  {o:T,x:-.8,name:'Tereza',desc:'Kudrnatá holka, která na dvorku cvičí agility s Ashley a Jackie. V ruce má vždycky pamlsek.'},
  {o:ashley,x:.5,name:'Ashley',desc:'Border kolie, blue merle: šedá s černými skvrnami, bílá hruď a tlapky, jedno oko modré a druhé hnědé, jazyk venku. Rychlá a přesná.'},
  {o:jackie,x:1.6,name:'Jackie',desc:'Zlatorezavá border kolie s bílou lysinkou, bílou hrudí a napůl vztyčenýma ušima. Ztřeštěná, občas odbočí z trati.'},
  {o:boban,x:2.7,name:'Boban',desc:'Černo-pálený jezevčík s modrým obojkem. Štěká, krade šroubky a nejde poslat pryč. Otrava celé hry.'}
];
cast.forEach(c=>{c.o.position.x=c.x;c.o.rotation.y=-.15;scene.add(c.o)});

// výběr postav
let sel=0;
$('bar').innerHTML=cast.map((c,i)=>`<button type="button" data-i="${i}">${c.name}</button>`).join('');
function pick(i){
  sel=i;
  document.querySelectorAll('#bar button').forEach((b,j)=>b.setAttribute('aria-pressed',j===i));
  $('nm').textContent=cast[i].name;$('ds').textContent=cast[i].desc;
}
$('bar').addEventListener('click',e=>{const b=e.target.closest('button');if(b)pick(+b.dataset.i)});
pick(0);

// orbit tažením
let yaw=0,pitch=.28,drag=null,dist=6.2;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw,pitch};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw=drag.yaw-(e.clientX-drag.x)*.008;pitch=Math.max(.05,Math.min(1.1,drag.pitch+(e.clientY-drag.y)*.005))});
canvas.addEventListener('pointerup',()=>drag=null);
const tgt=new THREE.Vector3(),look=new THREE.Vector3(0,.9,0);

function resize(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  R.setSize(w,h,false);cam.aspect=w/h;dist=w<h?7.5:5.4;cam.updateProjectionMatrix();
}
const ro=new ResizeObserver(resize);ro.observe(canvas);

const haf=$('haf'),v=new THREE.Vector3();
const clock=new THREE.Clock();
function tick(){
  const t=clock.getElapsedTime();
  ashley.userData.tail.rotation.z=Math.sin(t*9)*.5;
  jackie.userData.tail.rotation.z=Math.sin(t*12)*.6;
  boban.userData.tail.rotation.z=Math.sin(t*16)*.4;
  ashley.userData.head.rotation.y=Math.sin(t*.8)*.25;
  jackie.userData.head.rotation.z=Math.sin(t*1.3)*.2;
  // Boban štěká
  const bark=(t%2.2)<.5;
  boban.position.y=bark?Math.abs(Math.sin(t*20))*.06:0;
  boban.userData.head.rotation.x=bark?-.3+Math.sin(t*25)*.15:0;
  P.userData.armR.rotation.z=.1+Math.sin(t*30)*(t%3<.6?.04:0);
  T.userData.head.rotation.y=Math.sin(t*.7)*.3;
  // kamera
  const c=cast[sel];
  tgt.set(c.x,c.o===P||c.o===T?1.05:.45,0);
  look.lerp(tgt,.08);
  if(!drag)yaw+=(0-yaw)*.005;
  const d=c.o===P||c.o===T?dist:dist*.72;
  cam.position.set(look.x+Math.sin(yaw)*d*Math.cos(pitch),look.y+Math.sin(pitch)*d,Math.cos(yaw)*d*Math.cos(pitch));
  cam.lookAt(look);
  R.render(scene,cam);
  // bublina HAF
  v.set(boban.position.x,.9,boban.position.z).project(cam);
  haf.style.left=(v.x*.5+.5)*canvas.clientWidth+'px';haf.style.top=(-v.y*.5+.5)*canvas.clientHeight+'px';
  haf.classList.toggle('on',bark&&v.z<1);
  requestAnimationFrame(tick);
}
tick();
}
</script>
</body>
</html>
